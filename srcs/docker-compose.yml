name: Inception
services:

  nginx:
    build:
      context: requirements/nginx
    image: nginx
    container_name: nginx
    ports:
      - 443:443
    volumes:
      - ./requirements/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - wordpress:/var/www/wordpress
    depends_on:
      - wordpress
    restart: unless-stopped
    networks:
      - ft-network
    env_file: ".env"

  wordpress:
    build:
      context: requirements/wordpress
    image: wordpress
    container_name: wordpress
    volumes:
      - wordpress:/var/www/wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ft-network
    env_file:
      - ".env"
    secrets:
      - db_password
      - wordpress_admin_password
      - wordpress_user_password

  mariadb:
    build:
      context: requirements/mariadb
    image: mariadb
    container_name: mariadb
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ft-network
    env_file:
      - ".env"
    secrets:
      - db_password
      - db_root_password

#---Bonus---

  redis:
    build:
      context: requirements/bonus/redis
    image: redis
    container_name: redis
    restart: unless-stopped
    networks:
      - ft-network

  adminer:
    build:
      context: requirements/bonus/adminer
    image: adminer
    container_name: adminer
    restart: unless-stopped
    networks:
      - ft-network

  vsftpd:
    build:
      context: requirements/bonus/vsftpd
    image: vsftpd
    container_name: vsftpd
    volumes:
      - wordpress:/var/www/wordpress
    restart: unless-stopped
    networks:
      - ft-network
    ports:
      - 20:20
      - 21:21
      - 10090-10100:10090-10100
    env_file:
      - ".env"
    secrets:
      - ftp_password

  portainer:
    build:
      context: requirements/bonus/portainer
    image: portainer
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - ft-network
    ports:
      - 9443:9443
    secrets:
      - portainer_admin_password

  static-website:
    build:
      context: requirements/bonus/static-website
    image: static-website
    container_name: static-website
    restart: unless-stopped
    networks:
      - ft-network
    ports:
      - 8080:8080

#---volumes--- 

volumes:
  mariadb:
    driver: local
    driver_opts:
      o: bind
      type: none
      devices: /home/hdougoud/data
  wordpress:
    driver: local
    driver_opts:
      o: bind
      type: none
      devices: /home/hdougoud/data
  portainer_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      devices: /home/hdougoud/data

#---Networks---

networks:
  ft-network:

#---Secrets---

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/user_db_password.txt
  wordpress_admin_password:
    file: ../secrets/wp_admin_password.txt
  wordpress_user_password:
    file: ../secrets/wordpress_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
  portainer_admin_password:
    file: ../secrets/portainer_admin_password.txt


