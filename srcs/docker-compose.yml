services:

  nginx:
    image: nginx
    container_name: nginx
    ports:
      - 8080:80
      - 8443:443
    volumes:
      - ./requirements/nginx/conf:/etc/nginx/conf
    restart: unless-stopped
    env_file: "./.env"
    networks:
      - ft-network

  wordpress:
    image: wordpress
    container_name: wordpress
    env_file: "./../secrets/wordpress_db_password.txt"
    volumes:
      - wordpress:/var/www/html
    restart: unless-stopped
    depends_on:
      - mariadb
    networks:
      - ft-network

  mariadb:
    image: mariadb
    container_name: mariadb
    env_file: "./../secrets/mariadb_password.txt"
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ft-network

volumes:
  mariadb:
  wordpress:

networks:
  ft-network:
