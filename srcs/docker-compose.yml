services:

  nginx:
    build:
      context: requirements/nginx
    container_name: nginx
    ports:
      - 443:443
    volumes:
      - ./requirements/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - wordpress:/var/www/wordpress
    depends_on:
      - wordpress
    restart: unless-stopped
    networks:
      - ft-network
    env_file: ".env"

  wordpress:
    build:
      context: requirements/wordpress
    container_name: wordpress
    volumes:
      - wordpress:/var/www/wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ft-network
    env_file:
      - ".env"
    secrets:
      - db_password
      - wordpress_admin_password

  mariadb:
    build:
      context: requirements/mariadb
    container_name: mariadb
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ft-network
    env_file:
      - ".env"
    secrets:
      - db_password
      - db_root_password

#---Bonus---

  redis:
    build:
      context: requirements/bonus/redis
    container_name: redis
    restart: unless-stopped
    networks:
      - ft-network

  adminer:
    build:
      context: requirements/bonus/adminer
    container_name: adminer
    restart: unless-stopped
    networks:
      - ft-network
    ports:
      - 8080:8080

#---volumes--- 

#TODO: puts the volumes in /home/login/data folder
volumes:
  mariadb:
  wordpress:

#---Networks---

networks:
  ft-network:

#---Secrets---

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/user_db_password.txt
  wordpress_admin_password:
    file: ../secrets/wp_admin_password.txt


